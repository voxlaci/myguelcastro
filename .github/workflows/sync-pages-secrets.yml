name: Sync Cloudflare Pages env vars

# Empurra para o projeto Cloudflare Pages (myguel-santos-castro) as variáveis
# necessárias ao formulário de leads B2B (functions/team-building-lead.js) e
# faz logo um deploy para as ativar.
# Corre manualmente: Actions -> "Sync Cloudflare Pages env vars" -> Run workflow.
#
# Secrets/variáveis do repositório (Settings -> Secrets and variables -> Actions):
#   secrets.CLOUDFLARE_API_TOKEN   (já configurado)
#   secrets.RESEND_API_KEY         -> chave da conta Resend (obrigatório)
#   vars.LEAD_FROM      (opcional) -> default "Myguel Santos e Castro <info@voxlaci.com>"
#                                    (info@voxlaci.com é domínio verificado no Resend)
#   vars.LEAD_NOTIFY_TO (opcional) -> default "voxlaci@gmail.com"

on:
  workflow_dispatch:

concurrency:
  group: pages-sync-secrets
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Push env vars to the Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 8b2a655b8b234c8dc76b31074192dbb3
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          LEAD_FROM: ${{ vars.LEAD_FROM }}
          LEAD_NOTIFY_TO: ${{ vars.LEAD_NOTIFY_TO }}
        run: |
          if [ -z "$RESEND_API_KEY" ]; then
            echo "::error::Falta o secret RESEND_API_KEY no repositório (Settings -> Secrets and variables -> Actions)."
            exit 1
          fi
          export LEAD_FROM="${LEAD_FROM:-Myguel Santos e Castro <info@voxlaci.com>}"
          export LEAD_NOTIFY_TO="${LEAD_NOTIFY_TO:-voxlaci@gmail.com}"
          node -e 'process.stdout.write(JSON.stringify({RESEND_API_KEY:process.env.RESEND_API_KEY,LEAD_FROM:process.env.LEAD_FROM,LEAD_NOTIFY_TO:process.env.LEAD_NOTIFY_TO}))' \
            | npx --yes wrangler@4.106.0 pages secret bulk --project-name=myguel-santos-castro

      - name: Redeploy so the new env vars take effect
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 8b2a655b8b234c8dc76b31074192dbb3
          wranglerVersion: "4.106.0"
          command: pages deploy . --project-name=myguel-santos-castro --branch=main
